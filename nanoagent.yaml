_ > nanoagent.plugin.v0001.ManifestConfig:
id: av-coin-change
name: Coin Change
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  get_problem:
    description: "Show a coin problem by its id: the coin values available and the amount to make"
  greedy_change:
    description: Make an amount by always taking the largest coin that still fits, and report what is left over
  problem_record:
    description: The problem itself, pinned as the verifier's reference

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  get-problem:
    description: Show a coin problem
    runner: tool
    tools: [get_problem]
    reference: null
    instructions: Return the coin problem with this id.
  make-change:
    description: Make an amount with the fewest coins, or show it cannot be made
    runner: agent
    tools: [get_problem, greedy_change]
    reference: problem_record
    instructions: |-
      Read the problem with get_problem: the coin values available, each usable any number of times, and the amount to make exactly.
      Find the fewest coins that make the amount exactly, or decide that it cannot be made at all. greedy_change shows what always taking the largest coin gives; it is not always the fewest, and it can get stuck when another choice would work.
      You have a budget of 12 tool calls in all, get_problem included; after that every tool fails. Reason about the coins rather than calling tools at random.
      Submit possible and the coins you would use, in any order, or possible false with no coins.
      Every reply must be a tool call: never answer with text alone, or the run ends with nothing submitted. When you are done, stuck, or near the end of your budget, call submit. Set gave_up to false when you believe your answer is right; if you could not solve it, set gave_up to true and submit your best attempt, or empty values.
